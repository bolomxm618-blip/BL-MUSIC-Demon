<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,Arial}

:root{
  --bg:#070707;
  --panel:#0f0f12;
  --card:#151518;
  --red:#e50914;
  --red2:#9b0008;
  --text:#fff;
  --muted:#aaa;
  --line:#2b2b2f;
}

body{
  background:#070707;
  color:white;
}

.hidden{display:none!important}

.splash{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  gap:16px;
  background:linear-gradient(135deg,#000,#1b0305,#080808);
}

.splash img{
  width:170px;
  height:170px;
  object-fit:contain;
  border-radius:18px;
}

.splash h1{
  font-size:56px;
  color:#fff;
  letter-spacing:1px;
}

.splash h1::after{
  content:"";
  display:block;
  width:150px;
  height:5px;
  background:var(--red);
  border-radius:20px;
  margin:8px auto 0;
}

.splash p{color:#ddd}

button{
  border:0;
  border-radius:14px;
  padding:12px 18px;
  background:linear-gradient(90deg,var(--red),var(--red2));
  color:white;
  font-weight:800;
  cursor:pointer;
  transition:.2s;
}

button:hover{
  filter:brightness(1.15);
  transform:translateY(-1px);
}

.back-btn{
  margin-bottom:18px;
}

.app{
  display:grid;
  grid-template-columns:240px 1fr;
  min-height:100vh;
  padding-bottom:96px;
}

.sidebar{
  background:#0b0b0e;
  padding:20px;
  border-right:1px solid var(--line);
  position:sticky;
  top:0;
  height:100vh;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:25px;
}

.brand img{
  width:45px;
  height:45px;
  object-fit:contain;
  border-radius:10px;
}

.brand h2{font-size:24px}

.sidebar button{
  display:block;
  width:100%;
  margin:10px 0;
  text-align:left;
  background:#17171d;
  border:1px solid transparent;
}

.sidebar button:hover{
  border-color:var(--red);
  background:#211014;
}

.content{padding:25px}

.topbar input{
  width:100%;
  padding:15px;
  border-radius:16px;
  border:1px solid var(--line);
  background:#111116;
  color:white;
  margin-bottom:25px;
  outline:none;
}

.topbar input:focus{border-color:var(--red)}

.page{display:none}
.page.active{display:block}

.hero{
  padding:34px;
  border-radius:22px;
  background:linear-gradient(135deg,#250508,#111 70%);
  margin-bottom:25px;
  border:1px solid #2b2b31;
}

.hero h1{font-size:36px}
.hero p,.muted{color:var(--muted)}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:18px;
}

.card{
  background:var(--card);
  border-radius:18px;
  padding:12px;
  cursor:pointer;
  transition:.25s;
  border:1px solid #222229;
}

.card:hover{
  transform:translateY(-4px);
  border-color:var(--red);
}

.card img{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  border-radius:14px;
  background:#222;
}

.card h3{
  font-size:16px;
  margin:10px 0 4px;
}

.card p{color:var(--muted)}

.list{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.row{
  display:flex;
  align-items:center;
  gap:12px;
  background:var(--card);
  border-radius:14px;
  padding:10px;
  cursor:pointer;
  border:1px solid #222229;
}

.row:hover{border-color:var(--red)}

.row img{
  width:60px;
  height:60px;
  border-radius:12px;
  object-fit:cover;
  background:#222;
}

.artists-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:18px;
}

.artist-card{
  background:var(--card);
  border-radius:18px;
  padding:16px;
  text-align:center;
  cursor:pointer;
  transition:.25s;
  border:1px solid #222229;
}

.artist-card:hover{
  transform:translateY(-4px);
  border-color:var(--red);
}

.artist-card img{
  width:130px;
  height:130px;
  border-radius:50%;
  object-fit:cover;
  background:#222;
  margin-bottom:10px;
}

.artist-card h3{font-size:16px}

.artist-title{
  display:flex;
  align-items:center;
  gap:15px;
  margin-bottom:20px;
}

.artist-title img{
  width:85px;
  height:85px;
  border-radius:50%;
  object-fit:cover;
  background:#222;
  border:2px solid var(--red);
}

.player{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  background:#09090b;
  border-top:1px solid var(--line);
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 18px;
  z-index:99;
}

.player img{
  width:62px;
  height:62px;
  border-radius:12px;
  object-fit:cover;
  background:#222;
}

.player-info{
  flex:1;
  display:flex;
  flex-direction:column;
  gap:5px;
}

.player-info span{color:var(--muted)}

.player button{
  border-radius:50%;
  padding:10px 13px;
}

#progress{
  width:100%;
  accent-color:var(--red);
}

#timeInfo{
  font-size:12px;
  color:var(--muted);
}

.volume-box{
  display:flex;
  align-items:center;
  gap:6px;
}

.back-to-top{
  position:fixed;
  right:24px;
  bottom:115px;
  width:48px;
  height:48px;
  border-radius:50%;
  padding:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  line-height:1;
  z-index:98;
  opacity:0;
  visibility:hidden;
  transform:translateY(12px);
  transition:opacity .25s ease, visibility .25s ease, transform .25s ease;
}

.back-to-top.show{
  opacity:1;
  visibility:visible;
  transform:translateY(0);
}

.ad-slot{
  width:100%;
  min-height:90px;
  margin-top:28px;
  padding:10px;
  border:1px dashed #2b2b2f;
  border-radius:12px;
  background:#0f0f12;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.ad-slot:empty::before{
  content:"PUBLICIDAD";
  color:#555;
  font-size:11px;
  letter-spacing:1px;
}

#volume{
  width:120px;
  accent-color:var(--red);
}

#volumeText{
  font-size:13px;
  color:var(--muted);
  min-width:45px;
}

@media(max-width:800px){
  .app{grid-template-columns:1fr}

  .sidebar{
    position:fixed;
    bottom:0;
    top:auto;
    left:0;
    right:0;
    height:65px;
    display:flex;
    overflow:auto;
    z-index:100;
    padding:7px;
    border-top:1px solid var(--line);
    border-right:0;
  }

  .brand{display:none}

  .sidebar button{
    min-width:100px;
    font-size:12px;
    margin:0;
  }

  .content{padding:15px 12px 160px}
  .grid{grid-template-columns:repeat(2,1fr)}
  .player{bottom:65px;padding:8px}
  .ad-slot{display:none}
  .back-to-top{
    right:14px;
    bottom:145px;
    width:46px;
    height:46px;
  }
  #volume{width:80px}
  #volumeText{font-size:11px;min-width:38px}
  .splash h1{font-size:42px}
  .artist-card img{width:105px;height:105px}
}
</style>
</head>

    </div>

  <section class="content">

    <section id="artists" class="page">

    <section id="favorites" class="page">

      <div id="favoritesList" class="list"></div>
    </section>

    <section id="library" class="page">
      <h1>Biblioteca</h1>
      <p class="muted">Tus canciones guardadas localmente.</p>
    </section>
  </section>
</main>

<div id="player" class="player hidden">
  <img id="playerCover">

  <div class="player-info">
    <b id="playerTitle">Canción</b>
    <span id="playerArtist">Artista</span>
    <input id="progress" type="range" min="0" max="100" value="0">
    <div id="timeInfo">0:00 / 0:00</div>
  </div>

  <button id="prevBtn">⏮</button>
  <button id="playBtn">▶</button>
  <button id="nextBtn">⏭</button>
  <button id="favBtn">♡</button>

  <div class="volume-box">
    <input id="volume" type="range" min="0" max="100" step="1" value="100">
    <span id="volumeText">100%</span>
  </div>
</div>

<audio id="audio"></audio>

<button id="backToTop" class="back-to-top" aria-label="Volver arriba" title="Volver arriba">↑</button>

let currentIndex = 0;
let favorites = JSON.parse(localStorage.getItem("spoti_favorites") || "[]");
let autoMode = false;

const $ = id => document.getElementById(id);
const audio = $("audio");
audio.volume = 1;

$("enterBtn").onclick = () => {
  $("splash").classList.add("hidden");
  $("app").classList.remove("hidden");
  renderSongs(songs);
  renderRows(songs, $("searchResults"));
  renderArtists();
};

document.querySelectorAll("[data-page]").forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
    $(btn.dataset.page).classList.add("active");

    if(btn.dataset.page==="favorites") renderFavorites();
    if(btn.dataset.page==="artists") renderArtists();

    if(btn.dataset.page==="search"){
      resetSearchPage();
      renderRows(songs, $("searchResults"));
    }
  };
});

function resetSearchPage(){
  $("search").innerHTML = `
    <h1>Buscar</h1><br>
    <div id="searchResults" class="list"></div>
  `;
}

function goToPage(pageId){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  $(pageId).classList.add("active");
}

$("backFromArtists").onclick = () => {
  goToPage("home");
};

function renderSongs(list){
  $("songsGrid").innerHTML = "";

  list.forEach((song,i)=>{
    const card=document.createElement("div");
    card.className="card";
    card.innerHTML=`
      <img src="${song.coverUrl}" onerror="this.src='logo.png'">
      <h3>${song.title}</h3>
      <p>${song.artist}</p>
    `;
    card.onclick=()=>playSong(i,false);
    $("songsGrid").appendChild(card);
  });
}

function renderRows(list,container){
  container.innerHTML="";

  if(list.length===0){
    container.innerHTML="<p class='muted'>No hay resultados.</p>";
    return;
  }

  list.forEach(song=>{
    const i=songs.indexOf(song);
    const row=document.createElement("div");
    row.className="row";
    row.innerHTML=`
      <img src="${song.coverUrl}" onerror="this.src='logo.png'">
      <div style="flex:1">
        <b>${song.title}</b><br>
        <span class="muted">${song.artist} • ${song.genre}</span>
      </div>
      <button>▶</button>
    `;
    row.onclick=()=>playSong(i,false);
    container.appendChild(row);
  });
}

function getArtistSongs(artist){
  return songs.filter(song =>
    song.artist.toLowerCase().includes(artist.name.toLowerCase()) ||
    artist.name.toLowerCase().includes(song.artist.toLowerCase())
  );
}

function renderArtists(){
  const box = $("artistsGrid");
  if(!box) return;

  box.innerHTML = "";

  artists.forEach(artist=>{
    const artistSongs = getArtistSongs(artist);

    const card = document.createElement("div");
    card.className = "artist-card";
    card.innerHTML = `
      <img src="${artist.image}" onerror="this.src='logo.png'">
      <h3>${artist.name}</h3>
      <p class="muted">${artistSongs.length} canciones</p>
    `;
    card.onclick = () => showArtistSongs(artist);
    box.appendChild(card);
  });
}

function showArtistSongs(artist){
  const artistSongs = getArtistSongs(artist);

  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  $("search").classList.add("active");

  $("search").innerHTML = `
    <button id="backToArtists" class="back-btn">⬅ Retroceder</button>
    <div class="artist-title">
      <img src="${artist.image}" onerror="this.src='logo.png'">
      <div>
        <h1>${artist.name}</h1>
        <p class="muted">${artistSongs.length} canciones</p>
      </div>
    </div>
    <div id="searchResults" class="list"></div>
  `;

  $("backToArtists").onclick = () => {
    resetSearchPage();
    renderArtists();
    goToPage("artists");
  };

  renderRows(artistSongs, $("searchResults"));
}

function playSong(i,isAuto=false){
  if(!songs[i]) return;

  autoMode = isAuto;
  currentIndex = i;
  const song = songs[i];

  $("player").classList.remove("hidden");
  $("playerCover").src = song.coverUrl;
  $("playerTitle").textContent = song.title;
  $("playerArtist").textContent = song.artist;
  if ("mediaSession" in navigator){

    navigator.mediaSession.metadata = new MediaMetadata({
        title: song.title,
        artist: song.artist,
        album: "BL MUSIC",
        artwork: [
  {
    src: new URL(song.coverUrl, window.location.href).href,
    sizes: "512x512",
    type: "image/png"
  }
]
    });

    navigator.mediaSession.setActionHandler("play", ()=>audio.play());

    navigator.mediaSession.setActionHandler("pause", ()=>audio.pause());

    navigator.mediaSession.setActionHandler("nexttrack", ()=>{
        currentIndex++;

        if(currentIndex>=songs.length){
            currentIndex=0;
        }

        playSong(currentIndex,false);
    });

    navigator.mediaSession.setActionHandler("previoustrack", ()=>{
        currentIndex--;

        if(currentIndex<0){
            currentIndex=songs.length-1;
        }

        playSong(currentIndex,false);
    });

}
  $("favBtn").textContent = favorites.includes(song.title) ? "♥" : "♡";
  $("playBtn").textContent = "⏳";
  $("timeInfo").textContent = "0:00 / 0:00";
  $("progress").value = 0;

  audio.pause();
  audio.src = song.audioUrl;
  audio.load();

  audio.play().then(()=>{
    $("playBtn").textContent = "⏸";
  }).catch(error=>{
    console.log("No se pudo reproducir:", song.audioUrl, error);
    $("playBtn").textContent = "▶";

    if(isAuto){
      playRandomSong();
    }else{
      alert("No se pudo reproducir esta canción. Revisa que exista exactamente:\n" + song.audioUrl);
    }
  });
}

function randomSong(){
  if(songs.length <= 1) return currentIndex;

  let next;
  do{
    next = Math.floor(Math.random() * songs.length);
  }while(next === currentIndex);

  return next;
}

function playRandomSong(){
  playSong(randomSong(),true);
}

$("playBtn").onclick=()=>{
  if(audio.paused){
    audio.play().then(()=>{
      $("playBtn").textContent="⏸";
    }).catch(()=>{
      alert("Selecciona una canción manualmente.");
    });
  }else{
    audio.pause();
    $("playBtn").textContent="▶";
  }
};

$("nextBtn").onclick = () => {
    currentIndex++;

    if(currentIndex >= songs.length){
        currentIndex = 0;
    }

    playSong(currentIndex,false);
};

$("prevBtn").onclick = () => {
    currentIndex--;

    if(currentIndex < 0){
        currentIndex = songs.length-1;
    }

    playSong(currentIndex,false);
};

$("volume").oninput=e=>{
  const vol = Number(e.target.value);
  $("volumeText").textContent = vol + "%";
  audio.volume = Math.min(vol / 100, 1);
};

audio.ontimeupdate=()=>{
  if(audio.duration){
    $("progress").value=(audio.currentTime/audio.duration)*100;
    $("timeInfo").textContent = formatTime(audio.currentTime) + " / " + formatTime(audio.duration);
  }else{
    $("timeInfo").textContent = "0:00 / 0:00";
  }
};

function formatTime(seconds){
  if(!seconds || isNaN(seconds)) return "0:00";
  const mins = Math.floor(seconds / 60);
  const secs = Math.floor(seconds % 60);
  return mins + ":" + secs.toString().padStart(2,"0");
}

$("progress").oninput=e=>{
  if(audio.duration){
    audio.currentTime=(e.target.value/100)*audio.duration;
  }
};

audio.onended = () => {
  currentIndex++;

  if(currentIndex >= songs.length){
      currentIndex = 0;
  }

  playSong(currentIndex,true);
};

audio.onerror = () => {
  if(!songs[currentIndex]) return;

  $("playBtn").textContent = "▶";

  if(autoMode){
    playRandomSong();
  }else{
    alert("No se pudo reproducir esta canción. Revisa que exista exactamente:\n" + songs[currentIndex].audioUrl);
  }
};

$("favBtn").onclick=()=>{
  const title=songs[currentIndex].title;

  if(favorites.includes(title)){
    favorites=favorites.filter(x=>x!==title);
  }else{
    favorites.push(title);
  }

  localStorage.setItem("spoti_favorites",JSON.stringify(favorites));
  $("favBtn").textContent=favorites.includes(title)?"♥":"♡";
};

function renderFavorites(){
  const favSongs=songs.filter(s=>favorites.includes(s.title));
  renderRows(favSongs,$("favoritesList"));
}

const backToTop = $("backToTop");

window.addEventListener("scroll",()=>{
  if(window.scrollY > 500){
    backToTop.classList.add("show");
  }else{
    backToTop.classList.remove("show");
  }
},{passive:true});

backToTop.onclick=()=>{
  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
};

$("searchInput").oninput=e=>{
  const text=e.target.value.toLowerCase();

  const filtered=songs.filter(s=>
    s.title.toLowerCase().includes(text) ||
    s.artist.toLowerCase().includes(text) ||
    s.genre.toLowerCase().includes(text)
  );

  resetSearchPage();
  renderRows(filtered,$("searchResults"));

  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  $("search").classList.add("active");
};
</script>

</body>
</html>
